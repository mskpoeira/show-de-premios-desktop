<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telão — Show de Prêmios</title><style>*{box-sizing:border-box}body{margin:0;height:100vh;background:radial-gradient(circle at 50% 25%,#183a6a,#07101d 70%);color:#fff;font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;overflow:hidden}.screen{text-align:center;width:96vw}.label{letter-spacing:.3em;font-size:1.4vw;color:#77b5ff;font-weight:800}.title{font-size:clamp(30px,4.6vw,80px);margin:.8vh 0 2vh}.ball{margin:auto;width:min(35vw,42vh);height:min(35vw,42vh);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#fff,#caddf5);color:#0d3e7c;font-size:min(15vw,20vh);font-weight:900;border:min(1vw,1.3vh) solid #7ba9df;box-shadow:0 0 70px #2378d766}.numbers{margin:3vh auto 7vh;max-width:92vw;display:flex;flex-wrap:wrap;justify-content:center;gap:.5vw}.n{width:3.2vw;height:3.2vw;border-radius:50%;background:#19375e;color:#7193bd;display:grid;place-items:center;font-size:1.05vw;font-weight:800}.n.on{background:#1677ed;color:white}.pix{position:fixed;right:2vw;top:2vh;width:clamp(210px,18vw,300px);padding:1vw;background:#fff;color:#112849;border-radius:16px;display:none;box-shadow:0 16px 45px #0006}.pix.show{display:block}.pix strong{display:block;font-size:clamp(12px,1vw,19px);margin-bottom:.8vh}.pix img{width:clamp(105px,9vw,165px);height:clamp(105px,9vw,165px)}.ticker{position:fixed;bottom:0;left:0;right:0;padding:1.1vh;background:#0e61cb;font-size:clamp(14px,1.4vw,25px);font-weight:800}</style></head><body><div class="screen"><div class="label">SHOW DE PRÊMIOS</div><h1 class="title" id="round">Aguardando início</h1><div class="ball" id="ball">—</div><div class="numbers" id="numbers"></div></div><aside class="pix" id="pix"><strong id="pixBanner"></strong><img id="pixQr" alt="QR Code PIX"></aside><div class="ticker" id="ticker"></div><script>const $=s=>document.querySelector(s);let lastPix='';async function update(){const d=await window.showApp.load(),r=d.rounds.find(x=>x.status==='ready')||d.rounds.find(x=>x.status!=='completed')||d.rounds[0];$('#round').textContent=r.prize?`${r.name} • ${r.prize}`:r.name;$('#ball').textContent=r.drawn.at(-1)||'—';$('#numbers').innerHTML=Array.from({length:75},(_,i)=>`<span class="n ${r.drawn.includes(i+1)?'on':''}">${i+1}</span>`).join('');$('#ticker').textContent=`CARTELA ${Number(d.settings.salePrice).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} • 3 CARTELAS ${Number(d.settings.triplePrice).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}`;const p=d.settings.pix||{};$('#pix').classList.toggle('show',!!p.enabled&&!!p.key);$('#pixBanner').textContent=p.banner||'PAGUE COM PIX DIRETO DO SEU LUGAR';const sig=JSON.stringify(p);if(p.enabled&&p.key&&sig!==lastPix){try{const q=await window.showApp.pixQr(p,0,'SHOWPREMIOS');$('#pixQr').src=q.dataUrl;lastPix=sig}catch{}}}update();setInterval(update,800);</script></body></html>
