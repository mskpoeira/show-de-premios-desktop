<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telão — Show de Prêmios</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;background:radial-gradient(circle at 50% 25%,#183a6a,#07101d 70%);color:#fff;font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;overflow:hidden}.screen{text-align:center;width:96vw}.label{letter-spacing:.3em;font-size:1.4vw;color:#77b5ff;font-weight:800}.title{font-size:clamp(30px,4.6vw,80px);margin:.8vh 0 2vh}.ball{margin:auto;width:min(35vw,42vh);height:min(35vw,42vh);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#fff,#caddf5);color:#0d3e7c;font-size:min(15vw,20vh);font-weight:900;border:min(1vw,1.3vh) solid #7ba9df;box-shadow:0 0 70px #2378d766}.numbers{margin:3vh auto 7vh;max-width:92vw;display:flex;flex-wrap:wrap;justify-content:center;gap:.5vw}.n{width:3.2vw;height:3.2vw;border-radius:50%;background:#19375e;color:#7193bd;display:grid;place-items:center;font-size:1.05vw;font-weight:800}.n.on{background:#1677ed;color:white}.pix{position:fixed;right:2vw;top:2vh;width:clamp(210px,18vw,300px);padding:1vw;background:#fff;color:#112849;border-radius:16px;display:none}.pix.show{display:block}.pix strong{display:block;font-size:clamp(12px,1vw,19px);margin-bottom:.8vh}.pix img{width:clamp(105px,9vw,165px)}.ticker{position:fixed;bottom:0;left:0;right:0;padding:1.1vh;background:#0e61cb;font-size:clamp(14px,1.4vw,25px);font-weight:800}.exit{position:fixed;right:1.2vw;top:1.2vh;z-index:40;width:48px;height:48px;border:0;border-radius:50%;background:#d8333d;color:#fff;font-size:27px;cursor:pointer;box-shadow:0 8px 25px #0007}.winner{position:fixed;inset:0;z-index:30;background:radial-gradient(circle,#1557b0,#07101d 72%);display:none;place-items:center;text-align:center;padding:5vw}.winner.show{display:grid}.winner-card{max-width:1000px}.winner-kicker{font-size:clamp(20px,2.1vw,38px);letter-spacing:.15em;font-weight:900;color:#8ac4ff}.winner h1{font-size:clamp(44px,7vw,110px);margin:1vh 0}.winner-prize{font-size:clamp(25px,3.3vw,55px);font-weight:800}.winner-codes{margin:3vh 0;font-size:clamp(34px,5vw,80px);font-weight:950;color:#ffe879}.winner-status{font-size:clamp(18px,2vw,34px);font-weight:800}.winner-tie{margin-top:2vh;font-size:clamp(16px,1.5vw,26px);color:#d9e9ff}.session-error{position:fixed;inset:0;z-index:50;background:#07101d;display:none;place-items:center;text-align:center;font-size:3vw;font-weight:800}
</style>
</head>
<body>
<button class="exit" id="exitScreen" title="Sair do telão">×</button>
<div class="screen"><div class="label">SHOW DE PRÊMIOS</div><h1 class="title" id="round">Aguardando início</h1><div class="ball" id="ball">—</div><div class="numbers" id="numbers"></div></div>
<aside class="pix" id="pix"><strong id="pixBanner"></strong><img id="pixQr" alt="QR Code PIX"></aside><div class="ticker" id="ticker"></div>
<section class="winner" id="winner"><div class="winner-card"><div class="winner-kicker">TEMOS CARTELA VENCEDORA</div><h1 id="winnerRound">SHOW DE PRÊMIOS</h1><div class="winner-prize" id="winnerPrize"></div><div class="winner-codes" id="winnerCodes"></div><div class="winner-status" id="winnerStatus">VALIDADA</div><div class="winner-tie" id="winnerTie"></div></div></section>
<div class="session-error" id="sessionError">Sessão encerrada.<br>Reabra o telão após entrar novamente.</div>
<script>
const $=s=>document.querySelector(s);let lastPix='';
$('#exitScreen').onclick=()=>window.showApp.closeScreen();
function latestActiveWinner(d){return [...(d.winners||[])].filter(w=>w.status!=='canceled'&&w.at).sort((a,b)=>String(b.at).localeCompare(String(a.at)))[0]||null}
async function update(){
 try{
  const d=await window.showApp.load();
  const latest=latestActiveWinner(d),recent=latest&&Date.now()-Date.parse(latest.at)<20000;
  const winnerRound=recent?d.rounds.find(x=>String(x.id)===String(latest.roundId)):null;
  const r=winnerRound||d.rounds.find(x=>x.status==='ready')||d.rounds.find(x=>x.status!=='completed')||d.rounds.at(-1)||d.rounds[0];
  if(!r)return;
  $('#round').textContent=`${r.name} • ${(r.prizes||[]).map(p=>p.name).join(' • ')||'Aguardando prêmio'}`;
  $('#ball').textContent=r.drawn.at(-1)||'—';
  $('#numbers').innerHTML=Array.from({length:75},(_,i)=>`<span class="n ${r.drawn.includes(i+1)?'on':''}">${i+1}</span>`).join('');
  $('#ticker').textContent=`CARTELA ${Number(d.settings.salePrice).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} • 3 CARTELAS ${Number(d.settings.triplePrice).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}`;
  $('#winner').classList.toggle('show',!!recent);
  if(recent){$('#winnerRound').textContent=latest.roundName||`Rodada ${latest.roundId}`;$('#winnerPrize').textContent=latest.prizeName||'Prêmio';$('#winnerCodes').textContent=(latest.cardCodes||[]).join(' • ');$('#winnerStatus').textContent='CARTELA VALIDADA';$('#winnerTie').textContent=latest.tie?`EMPATE — ${latest.cardCodes.length} CARTELAS VENCEDORAS`:'';}
  const p=d.settings.pix||{};$('#pix').classList.toggle('show',!recent&&!!p.enabled&&!!p.key);$('#pixBanner').textContent=p.banner||'PAGUE COM PIX DIRETO DO SEU LUGAR';const sig=JSON.stringify(p);if(p.enabled&&p.key&&sig!==lastPix){try{const q=await window.showApp.pixQr(p,0,'SHOWPREMIOS');$('#pixQr').src=q.dataUrl;lastPix=sig}catch{}}
  $('#sessionError').style.display='none';
 }catch(e){$('#sessionError').style.display='grid'}
}
update();setInterval(update,800);
</script>
</body></html>
