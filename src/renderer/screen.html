<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telão — Show de Prêmios</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 25%,#183a6a,#07101d 70%);color:#fff;font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;overflow:hidden}.screen{text-align:center;width:96vw}.label{letter-spacing:.3em;font-size:1.4vw;color:#77b5ff;font-weight:800}.title{font-size:4.6vw;margin:.8vh 0 2vh}.ball{margin:auto;width:min(35vw,45vh);height:min(35vw,45vh);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#fff,#caddf5);color:#0d3e7c;font-size:min(15vw,21vh);font-weight:900;border:min(1vw,1.3vh) solid #7ba9df;box-shadow:0 0 70px #2378d766}.numbers{margin:4vh auto 0;max-width:92vw;display:flex;flex-wrap:wrap;justify-content:center;gap:.55vw}.n{width:3.4vw;height:3.4vw;border-radius:50%;background:#19375e;color:#7193bd;display:grid;place-items:center;font-size:1.15vw;font-weight:800}.n.on{background:#1677ed;color:white}.footer{margin-top:2.5vh;color:#7193bd;font-size:1.2vw}</style></head><body><div class="screen"><div class="label">SHOW DE PRÊMIOS</div><h1 class="title" id="round">Aguardando início</h1><div class="ball" id="ball">—</div><div class="numbers" id="numbers"></div><div class="footer">Acompanhe os números sorteados</div></div><script>const $=s=>document.querySelector(s);async function update(){const d=await window.showApp.load(),r=d.rounds.find(x=>x.status==='ready')||d.rounds.find(x=>x.status!=='completed')||d.rounds[0];$('#round').textContent=r.prize?`${r.name} • ${r.prize}`:r.name;$('#ball').textContent=r.drawn.at(-1)||'—';$('#numbers').innerHTML=Array.from({length:75},(_,i)=>`<span class="n ${r.drawn.includes(i+1)?'on':''}">${i+1}</span>`).join('')}update();setInterval(update,800);</script></body></html>
