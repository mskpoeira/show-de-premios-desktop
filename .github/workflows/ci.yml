name: CI

on:
  push:
    branches: [main, "fix/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  version-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize VERSION and package-lock with package.json
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.version || !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(pkg.version)) {
            throw new Error(`Versão inválida em package.json: ${pkg.version}`);
          }
          fs.writeFileSync('VERSION', pkg.version + '\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          console.log(`Versão sincronizada: ${pkg.version}`);
          NODE

          if git diff --quiet -- VERSION package-lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Metadados de versão já sincronizados.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Metadados de versão divergentes; serão corrigidos automaticamente.'
          fi
      - name: Commit automatic version corrections
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION package-lock.json
          git commit -m 'chore(version): auto-sync version metadata'
          git push origin HEAD:main

  verify:
    needs: version-sync
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       needs.version-sync.result == 'skipped' ||
       (needs.version-sync.result == 'success' && needs.version-sync.outputs.changed != 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate version metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const versionFile = fs.existsSync('VERSION') ? fs.readFileSync('VERSION', 'utf8').trim() : pkg.version;
          const rootLockVersion = lock.packages?.['']?.version;
          if (versionFile !== pkg.version || lock.version !== pkg.version || rootLockVersion !== pkg.version) {
            console.error({ package: pkg.version, versionFile, lock: lock.version, rootLockVersion });
            process.exit(1);
          }
          console.log(`Versão consistente: ${pkg.version}`);
          NODE
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high

  windows-package:
    needs: version-sync
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       needs.version-sync.result == 'skipped' ||
       (needs.version-sync.result == 'success' && needs.version-sync.outputs.changed != 'true'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high

      - name: Build Windows NSIS installer
        shell: pwsh
        run: npm run pack:win

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v4
        with:
          name: show-de-premios-windows-v${{ github.run_number }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
